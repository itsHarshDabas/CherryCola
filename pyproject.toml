[project]
name = "cherrycolallm"
version = "0.3.0"
description = "GraceOS local model runtime (Ollama, llama.cpp, LM Studio; stdlib only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cherrycolallm = "cherrycola.cli:main"
cherrycola = "cherrycola.cli:main"  # the old name, kept as an alias

[project.gui-scripts]
cherrycolallm-chat = "cherrycola.gui:main"  # needs PyGObject, GTK 4 and libadwaita
cherrycola-chat = "cherrycola.gui:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cherrycola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
