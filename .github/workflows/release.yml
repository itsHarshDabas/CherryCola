# Push a tag like v1.0 (matching pyproject.toml) to publish a release, or run
# this workflow by hand (Actions > release > Run workflow): it tags the
# chosen branch as v<pyproject version> itself, then builds and publishes.
# Either way it publishes:
# Linux .tar.gz/.deb/.rpm, an Arch package, a Windows .exe, a wheel, and
# a Scoop manifest, all attached to a GitHub release.
# Optional, when set up in the repo settings:
#   - secret AUR_SSH_PRIVATE_KEY: also push packaging/arch/PKGBUILD to the AUR
#   - variable PUBLISH_PYPI = true: also publish to PyPI (trusted publishing)
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the tag on a manual run
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$want"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              # a tag left by a run that was stopped before it published
              # anything is moved to this commit; a released one never is
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "$tag is already released: bump the version in pyproject.toml first" >&2; exit 1
              fi
              echo "$tag exists but was never released: moving it to $GITHUB_SHA"
            fi
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
          else
            tag=$GITHUB_REF_NAME
            if [ "${tag#v}" != "$want" ]; then
              echo "tag $tag doesn't match pyproject.toml version $want" >&2; exit 1
            fi
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest && python -m pytest -q

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: packaging/build-linux.sh "${{ needs.version.outputs.version }}"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build && python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  arch:
    needs: [version, test]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with makepkg
        run: |
          pacman -Syu --noconfirm --needed base-devel pacman-contrib git python
          useradd -m builder
          mkdir -p /tmp/pkg && cp packaging/arch/PKGBUILD /tmp/pkg/
          sed -i "s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/" /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          cd /tmp/pkg
          su builder -c 'updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg --noconfirm'
          mkdir -p "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/aur"
          cp *.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
          cp PKGBUILD .SRCINFO "$GITHUB_WORKSPACE/aur/"
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: dist/* }
      - uses: actions/upload-artifact@v4
        with: { name: aur, path: aur/, include-hidden-files: true }

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pyinstaller
      - run: python -m pytest -q
      - name: Build the chat window (Rust)
        run: cargo build --release --manifest-path gui/Cargo.toml
      - run: pyinstaller --onefile --name cherrycolallm --paths . packaging/windows/cherrycola_cli.py
      - name: Check the exe runs
        run: |
          dist\cherrycolallm.exe --help
          dist\cherrycolallm.exe settings --list
      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" "/DSourceExe=$PWD\dist\cherrycolallm.exe" "/DGuiExe=$PWD\gui\target\release\cherrycolallm-gui.exe" "/O$PWD\installer" packaging\windows\cherrycolallm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip it, and fill in the Scoop manifest
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\cherrycolallm.exe, gui\target\release\cherrycolallm-gui.exe, packaging\windows\README.txt out\
          $zip = "cherrycolallm-$v-windows-x64.zip"
          Compress-Archive -Path out\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          (Get-Content packaging\windows\scoop.json) -replace '@VERSION@', $v -replace '@SHA256@', $hash | Set-Content cherrycolallm.json
          New-Item -ItemType Directory release | Out-Null
          Move-Item $zip, cherrycolallm.json release\
          Move-Item installer\*.exe release\
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: release/* }

  release:
    needs: [version, linux, arch, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, pattern: '{linux,arch,windows}', merge-multiple: true }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd assets && sha256sum * > SHA256SUMS)
          gh release create "${{ needs.version.outputs.tag }}" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "CherryColaLLM ${{ needs.version.outputs.version }}" --generate-notes

  aur:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aur, path: aur }
      - name: Push to the AUR (only when AUR_SSH_PRIVATE_KEY is set)
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No AUR_SSH_PRIVATE_KEY secret: skipping the AUR."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/cherrycolallm.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "CherryColaLLM release"
          git config user.email "cherrycolallm-release@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ needs.version.outputs.version }}" && git push origin HEAD:master

  pypi:
    needs: [release]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: linux, path: all }
      - run: mkdir dist && cp all/*.whl all/cherrycolallm-*.tar.gz dist/ && rm -f dist/*-linux.tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
